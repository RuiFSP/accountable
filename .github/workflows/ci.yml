# CI on every push: fail on a leaked secret before anything else is set up,
# then run the same gates as `npm run check`. Google Chrome comes from the
# GitHub runner image, so Playwright launches it without a browser install
# (playwright.config.ts looks for /opt/google/chrome/chrome).
name: CI

on:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned release, same version as `npm run secrets` uses locally.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        run: gitleaks dir . --no-banner

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # astral-sh/setup-uv has no major-version tag (no `v10`), so this pins
      # the full release tag; `version: latest` installs the newest uv.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

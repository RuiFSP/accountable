<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Accountable</title>
    <!--
      Apply the stored theme before first paint, so a System reload never
      flashes the wrong mode. The key, the values and the resolution mirror
      src/lib/theme.ts, which theme.test.ts keeps in step by running this.
    -->
    <script>
      (function () {
        var choice = "light";
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "light" || stored === "dark" || stored === "system") {
            choice = stored;
          }
        } catch (error) {
          choice = "light";
        }
        var mode = choice;
        if (choice === "system") {
          mode =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.setAttribute("data-theme", mode);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
